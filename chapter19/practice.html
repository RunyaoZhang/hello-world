<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第十九章 · 练</title></head><body><p id="loading" style="font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;padding:24px;color:#666">正在加载第十九章题库…</p><script>(async()=>{try{const [headRes,tailRes]=await Promise.all([fetch('practice.head.txt',{cache:'no-store'}),fetch('practice.data.txt',{cache:'no-store'})]);if(!headRes.ok)throw new Error(`practice.head.txt 加载失败（HTTP ${headRes.status}）`);if(!tailRes.ok)throw new Error(`practice.data.txt 加载失败（HTTP ${tailRes.status}）`);const head=(await headRes.text()).trim();const tail=(await tailRes.text()).trim();const b64=head+tail;if(head.length!==2241||tail.length!==19999||b64.length!==22240||!b64.startsWith('H4sI'))throw new Error('题库数据不完整，请刷新后重试');if(!('DecompressionStream' in window))throw new Error('当前浏览器版本过旧，不支持题库解压，请升级浏览器');const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const html=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();if(!html.includes('租赁 · 刷题小站')||!html.includes('错题本')||!html.includes('全部练习 · 25 题'))throw new Error('题库内容校验失败');document.open();document.write(html);document.close()}catch(e){console.error(e);document.body.innerHTML=`<div style="font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;max-width:720px;margin:40px auto;padding:24px"><h2>第十九章加载失败</h2><p>${String(e)}</p><p>请刷新页面；如果仍失败，请返回学习站首页。</p><p><a href="../index.html">← 返回学习站</a></p></div>`}})();</script></body></html>
