<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第十九章 · 练</title><body><p style="font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;padding:24px;color:#666">正在加载第十九章题库…</p><script>(async()=>{try{const b64=(await fetch('practice.data.txt')).then(r=>r.text());const bin=Uint8Array.from(atob(b64.trim()),c=>c.charCodeAt(0));const html=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<p style="font-family:sans-serif;padding:24px">加载失败，请刷新页面。<br>'+e+'</p>'}})();</script></body>
