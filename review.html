<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>21—25章 · 主动回忆复习</title><style>:root{--bg:#f4f1eb;--paper:#fffdf9;--ink:#25221f;--muted:#6f6961;--line:#e2d9cd;--green:#246b5a;--red:#9b4d58}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.72}.wrap{width:min(1000px,100%);margin:auto;padding:28px 18px 70px}.back{color:var(--muted);text-decoration:none;font-size:14px}h1{font-size:clamp(40px,6vw,62px);line-height:1.06;letter-spacing:-.04em;margin:20px 0 9px}.lead{font-size:18px;color:var(--muted);max-width:800px}.tabs{display:flex;gap:7px;flex-wrap:wrap;position:sticky;top:0;padding:12px 0;background:rgba(244,241,235,.95);backdrop-filter:blur(12px);z-index:10}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font:inherit;font-size:12px;font-weight:850;cursor:pointer}.tabs button.on{background:var(--green);color:#fff;border-color:var(--green)}.progress{font-size:12px;color:var(--muted);margin:2px 0 12px}.grid{display:grid;gap:12px}.q{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px 19px;box-shadow:0 8px 28px rgba(58,47,35,.05)}.meta{font-size:11px;font-weight:900;color:var(--green);letter-spacing:.06em}.q h2{font-size:19px;line-height:1.5;margin:5px 0 12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:1px solid #d5cabd;background:#fff;border-radius:12px;padding:8px 11px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}.actions button:hover{background:#f8f2ea}.answer{display:none;margin-top:12px;padding:13px 14px;border-left:4px solid var(--green);background:#edf6f1;border-radius:0 13px 13px 0}.answer b{display:block;margin-bottom:4px}.reason{color:#544e47;font-size:14px}.mark{margin-top:9px;display:flex;gap:7px}.mark button{font-size:12px}.mark .bad{color:var(--red)}.q.known{opacity:.62}.q.known::after{content:'✓ 已掌握';display:inline-block;margin-top:8px;font-size:11px;font-weight:900;color:var(--green)}@media(max-width:650px){.wrap{padding:20px 12px 50px}.q{padding:16px 15px}}</style></head><body><main class="wrap"><a class="back" href="index.html">← 会计学习站</a><h1>21—25章 · 主动回忆</h1><p class="lead">先自己判断，再展开答案。这里不重新讲整章，只抓最容易混、最能检验“到底懂没懂”的分界点。</p><div class="tabs"><button class="on" data-ch="all">全部</button><button data-ch="21">第21章</button><button data-ch="22">第22章</button><button data-ch="23">第23章</button><button data-ch="24">第24章</button><button data-ch="25">第25章</button><button id="weak" data-ch="weak">只看没掌握</button></div><div class="progress" id="progress"></div><section class="grid" id="grid"></section></main><script>
const DATA=[
[21,'合并集团内部，母公司“应收账款500万”，子公司“应付账款500万”。合并报表里应该把两边都保留吗？','不应该。','集团整体不能既“欠自己钱”又“被自己欠钱”。内部债权、债务要抵销；如果内部应收账款还计提了坏账准备，还要继续处理相应减值影响。'],
[21,'非同一控制下购买子公司时，子公司某项存货购买日账面价值2000万、公允价值2110万。合并报表能直接沿用子公司账面数吗？','不能直接沿用。','购买日要先把可辨认资产、负债调整到购买日公允价值，再处理这些评估增减值在后续期间实现时对成本、折旧、损益等的影响。'],
[21,'母公司卖商品给子公司且集团对外还没卖掉，母公司个别报表确认的利润，对集团整体来说已经真正实现了吗？','没有完全实现。','从集团视角只是把货从左口袋移到右口袋。对外销售前，内部交易形成的未实现损益不能当成集团对外赚到的利润。'],
[22,'固定资产原来预计还能用4年，后来因为新信息判断只能再用2年。要不要把以前年度折旧全部翻回去重算？','不要。','这属于会计估计更新。以前的信息条件下原估计可以是合理的，所以从变更日起按新估计未来适用。'],
[22,'今年发现去年漏提了一笔本来就应该计提的重大折旧。这是“估计变更”吗？','不是，是前期差错。','当时所需信息已经存在，只是没有正确处理。重要前期差错通常追溯重述，并调整比较数据、期初留存收益等。'],
[22,'企业改变确认、计量基础或一整套会计处理原则，和只是把使用寿命等参数估得更准，最大的区别是什么？','前者更接近会计政策变更，后者是会计估计变更。','先判断“规则层”有没有换，再判断是否只是同一规则下参数和方法因新信息而更新。'],
[23,'12月31日企业已有未决诉讼，年后财报批准报出前法院判决，只是把赔偿金额确定得更清楚。这属于调整事项吗？','属于。','年后判决提供的是年末已经存在状况的进一步证据，所以要把新证据反映回报告年度。'],
[23,'年后财报批准报出前，公司新签了一笔用于购置设备的银行贷款。它属于调整事项吗？','通常不属于调整事项。','贷款合同是年后新发生的事项，并不是在证明年末已经存在的状况。重大时考虑披露，而不是改年末数字。'],
[23,'日后调整事项涉及年后实际支付赔偿款，报告年度的“银行存款”也一起调吗？','不调报告年度货币资金。','调整的是能证明年末状况的部分；年后真实现金支付仍是年后的现金事项，不把年后的现金流硬塞回上一年。'],
[24,'事业单位收到一笔纳入部门预算管理的现金收入，只做财务会计分录够不够？','通常不够。','这类现金收支一般需要平行记账：财务会计记录经济业务，预算会计同时记录预算收入/支出及资金结存变化。'],
[24,'事业单位月末给已经购入的固定资产计提折旧，预算会计也要同时确认“事业支出”吗？','不需要机械同步。','折旧是财务会计的权责发生制费用，并没有发生新的预算现金支出。课件例题明确：购入时预算会计确认支出，月末折旧时预算会计不作处理。'],
[24,'为什么政府会计里同一笔收款有时会同时出现“银行存款/事业收入”和“资金结存/事业预算收入”？','因为在回答两个不同问题。','前一套是财务会计：经济资源和收入怎么变；后一套是预算会计：预算资金实际收了多少、预算执行到哪。'],
[25,'基金会只签了“以后要接受一笔捐赠”的承诺，但确认条件还没满足。现在就确认捐赠收入吗？','不确认。','捐赠承诺本身不满足非交换交易收入的确认条件时，不确认捐赠收入。'],
[25,'捐赠人指定最终受益人，基金会只能代收后转交，不能改变受益人或用途。基金会确认自己的捐赠收入吗？','不按自己的捐赠收入处理。','基金会只是中介，属于受托代理业务，核心是确认受托代理资产和受托代理负债。'],
[25,'收到捐款时，捐赠人规定只能在明年用于特定公益项目。这笔收入先看成限定性还是非限定性？','限定性。','外部捐赠人设置了时间或用途限制，所以先按限定性捐赠收入及限定性净资产逻辑核算，限制解除后再按本章规则重分类。'],
[21,'子公司把商品卖给母公司（逆流交易），形成的未实现损益在合并时只冲减母公司的净利润吗？','不是全冲母公司。','逆流交易的未实现损益（扣除所得税影响后）要按母公司持股比例，在“归属于母公司所有者的净利润”和“少数股东损益”之间分配抵销；顺流交易（母公司卖给子公司）才全额冲减母公司净利润。'],
[21,'合并资产负债表上，“少数股东权益”出现负数，是不是报表做错了？','不是做错。','少数股东权益是合并报表特有的项目，不要求永远为正；少数股东损益同样只存在于合并报表。'],
[21,'子公司账上有一笔“长期股权投资”，其实是持有母公司的股份。合并报表里还放在长期股权投资吗？','不，转列为库存股。','从集团整体看这相当于自己持有自己的股份，按取得成本转列库存股，作为所有者权益的减项。'],
[21,'子公司少数股东以货币资金增资，集团收到这笔钱，在合并现金流量表里算投资活动吗？','算筹资活动。','这是集团从外部少数股东收到的权益性资金，列入“筹资活动产生的现金流量”，不是投资活动。'],
[22,'会计政策变更追溯时，如果算不出对前期各期分别的影响数，但能算出当期期初的累积影响数，怎么处理？','从能追溯的最早期间期初开始用新政策。','“不切实可行”有两档退法：算不出各期影响数，就从能追溯的最早期间期初用新政策；如果连当期期初的累积影响数都算不出来，就直接采用未来适用法，不再追溯。'],
[22,'公司出售部分股权丧失控制权，剩余股权从成本法改按权益法核算。这属于会计政策变更吗？','不属于。','这是本期交易发生本质变化后采用适用的新政策。编制合并报表时统一子公司的会计政策，也不是会计估计变更。'],
[22,'一项研发支出在费用化之后才达到资本化条件，之前费用化的部分能转回无形资产成本吗？','不能。','研究阶段费用化的钱泼出去收不回；若前期误资本化了，应冲减无形资产、转回对应摊销，再通过“以前年度损益调整”处理。'],
[22,'重要前期差错追溯重述时，除了调报表和期初留存收益，还容易漏掉什么？','每股收益。','需要披露每股收益的企业，要同步重算基本每股收益和稀释每股收益。'],
[23,'日后调整事项涉及损益，发生在所得税汇算清缴之后，还调不调报告年度的应交所得税？','通常不再调。','发生在汇算清缴之后、涉及损益的调整事项，一般不再调整报告年度的应纳税额；发生在汇算清缴之前、符合税法规定的，才调整报告年度应交所得税。'],
[23,'一项涉及损益的日后调整事项，要同时动哪几张表？','三张表一起动。','同步调整报告年度资产负债表、利润表和所有者权益变动表相关项目，再按规定结转盈余公积和未分配利润。'],
[23,'在日后期间发现报告年度有个不重大的会计差错，还算日后调整事项吗？','算。','在日后期间发现的报告年度会计差错，无论是否重大，都属于资产负债表日后调整事项。'],
[23,'报告年度的销售在日后期间被退回，且退货证明销售时就有问题。只冲收入就行了吗？','不止。','冲回报告年度收入和销项税、恢复存货并冲回成本，同时处理报告年度所得税、未分配利润和盈余公积。注意退货必须发生在日后期间内，出了期间就是当期事项。'],
[23,'资产负债表日后才审议通过的现金股利分配方案，要调增报告年度的应付股利吗？','不调。','在资产负债表日还没有形成现时义务，所以不调整报告年度负债；重大时作为非调整事项披露。'],
[24,'事业单位预收款方式下，收到款时财务会计和预算会计分别确认什么？','财务先记预收账款，预算先记事业预算收入。','收钱和确认收入不是同一天：以后按合同完成进度，财务会计再确认事业收入，预算会计不再重复确认。'],
[24,'固定资产按月计提折旧时，预算会计要同步确认一笔“事业支出”吗？','不要。','折旧属于非现金消耗，只做财务会计“业务活动费用—固定资产累计折旧”，预算会计不作处理。'],
[24,'事业单位对无权参与其财务和经营决策的被投资单位，长期股权投资用成本法还是权益法？','成本法。','不能机械照搬企业会计的判断口径。'],
[24,'一家与机关脱钩的行业协会，纳不纳入该部门合并财务报表的范围？','不纳入。','合并范围看实际管理关系：所属企业、与机关脱钩的行业协会、无财政预算拨款关系的挂靠组织等不纳入。'],
[25,'限定性捐款因基金会自身原因没按限制用完，剩余款要退回捐赠人。直接冲减净资产吗？','不，通过费用确认退款义务。','例25-6：借记管理费用、贷记其他应付款，而不是继续留在净资产里。']
];
const grid=document.getElementById('grid'),prog=document.getElementById('progress');let filter='all';
const key=i=>`acct_review_${i}`;
function render(){grid.innerHTML='';let shown=0,known=0;DATA.forEach((d,i)=>{const mastered=localStorage.getItem(key(i))==='1';if(mastered)known++;if(filter!=='all'&&filter!=='weak'&&String(d[0])!==filter)return;if(filter==='weak'&&mastered)return;shown++;const a=document.createElement('article');a.className='q'+(mastered?' known':'');a.innerHTML=`<div class="meta">CHAPTER ${d[0]}</div><h2>${d[1]}</h2><div class="actions"><button class="show">显示答案</button></div><div class="answer"><b>${d[2]}</b><div class="reason">${d[3]}</div><div class="mark"><button class="good">我会了</button><button class="bad">还不熟</button></div></div>`;a.querySelector('.show').onclick=e=>{const x=a.querySelector('.answer');x.style.display=x.style.display==='block'?'none':'block';e.target.textContent=x.style.display==='block'?'收起答案':'显示答案'};a.querySelector('.good').onclick=()=>{localStorage.setItem(key(i),'1');render()};a.querySelector('.bad').onclick=()=>{localStorage.removeItem(key(i));render()};grid.append(a)});prog.textContent=`已掌握 ${known} / ${DATA.length} · 当前显示 ${shown} 题`;}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.ch;render()});render();
try{const _c=new URLSearchParams(location.search).get('ch');if(_c){const _b=Array.prototype.find.call(document.querySelectorAll('.tabs button'),b=>b.dataset.ch===_c);if(_b)_b.click();}}catch(e){}
</script></body></html>
