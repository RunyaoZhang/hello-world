name: Deploy accounting study site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Assemble large learning pages
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' src; do
            dir="$(dirname "$src")"
            parts=("$src")
            n=2
            while [ -f "$src.part$n" ]; do
              parts+=("$src.part$n")
              n=$((n+1))
            done
            cat "${parts[@]}" | base64 -d | gzip -dc > "$dir/learn.html"
            rm "${parts[@]}"
          done < <(find . -path './chapter*/learn.html.gz.b64' -print0)
      - name: Inject learning enhancements
        shell: bash
        run: |
          set -euo pipefail
          for n in 21 22 23 24 25; do
            f="chapter${n}/learn.html"
            [ -f "$f" ] || continue
            python3 - "$f" "$n" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); n=int(sys.argv[2])
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="../assets/enhance.css">'
          css2='<link rel="stylesheet" href="../assets/upgrade2.css">'
          js='<script src="../assets/enhance.js"></script>'
          js2='<script src="../assets/upgrade2.js"></script>'
          rel='<script src="../assets/relations.js"></script>'
          audit_path=pathlib.Path(f'assets/audit{n}.js')
          audit=f'<script src="../assets/audit{n}.js"></script>'
          if 'assets/enhance.css' not in s: s=s.replace('</head>',css+'</head>')
          if 'assets/upgrade2.css' not in s: s=s.replace('</head>',css2+'</head>')
          if 'assets/enhance.js' not in s: s=s.replace('</body>',js+'</body>')
          if 'assets/upgrade2.js' not in s: s=s.replace('</body>',js2+'</body>')
          if 'assets/relations.js' not in s: s=s.replace('</body>',rel+'</body>')
          if audit_path.exists() and f'assets/audit{n}.js' not in s: s=s.replace('</body>',audit+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
          done
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="assets/home.js"></script>'
          if 'assets/home.js' not in s: s=s.replace('</body>',tag+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Build study indexes
        shell: bash
        run: |
          python3 tools/build_glossary.py
          python3 tools/build_entries.py
      - name: Pre-deploy integrity checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, sys

          errors = []
          root = pathlib.Path('.')

          # The main failure mode we hit before: a corrupt multipart gzip can
          # produce no usable learning page. Require every audited chapter to
          # exist and look like a complete HTML document after assembly.
          for n in range(21, 26):
              page = root / f'chapter{n}' / 'learn.html'
              if not page.exists():
                  errors.append(f'missing {page}')
                  continue
              text = page.read_text(encoding='utf-8', errors='strict')
              low = text.lower()
              if '<html' not in low or '</html>' not in low:
                  errors.append(f'incomplete HTML in {page}')
              if len(text) < 1000:
                  errors.append(f'suspiciously small {page}: {len(text)} bytes')

              required = [
                  '../assets/enhance.css',
                  '../assets/upgrade2.css',
                  '../assets/enhance.js',
                  '../assets/upgrade2.js',
                  '../assets/relations.js',
              ]
              for asset in required:
                  if asset not in text:
                      errors.append(f'{page} missing injected asset {asset}')

              audit = root / 'assets' / f'audit{n}.js'
              if audit.exists() and f'../assets/audit{n}.js' not in text:
                  errors.append(f'{page} missing audit{n}.js injection')

          for path in [
              root/'index.html',
              root/'assets'/'enhance.css',
              root/'assets'/'upgrade2.css',
              root/'assets'/'enhance.js',
              root/'assets'/'upgrade2.js',
              root/'assets'/'relations.js',
          ]:
              if not path.exists():
                  errors.append(f'missing required site file {path}')

          if errors:
              print('PRE-DEPLOY CHECK FAILED')
              for e in errors:
                  print(f'::error::{e}')
              sys.exit(1)

          print('Pre-deploy integrity checks passed for chapters 21-25.')
          PY
      - name: Static asset and link checks
        shell: bash
        run: |
          set -euo pipefail
          # 1. All site JS must parse cleanly.
          for f in assets/*.js; do node --check "$f"; done
          echo "JS syntax OK"
          python3 - <<'PY'
          import pathlib, re, sys

          errors = []
          root = pathlib.Path('.')

          # 2. gzip shard continuity: part numbering must be continuous
          #    with no gaps and no orphaned extra parts.
          for n in range(21, 26):
              d = root / f'chapter{n}'
              base = d / 'learn.html.gz.b64'
              if base.exists():
                  k = 1
                  while (d / f'learn.html.gz.b64.part{k+1}').exists():
                      k += 1
                  for extra in d.glob('learn.html.gz.b64.part*'):
                      m = re.fullmatch(r'learn\.html\.gz\.b64\.part(\d+)', extra.name)
                      if m and int(m.group(1)) > k:
                          errors.append(f'orphaned shard {extra}')
                  print(f'chapter{n}: {k} shard(s) continuous')
              elif (d / 'learn.html').exists():
                  print(f'chapter{n}: plain learn.html (no shards)')
              else:
                  errors.append(f'chapter{n}: neither learn.html nor shards found')

          # 3. Internal ../assets/* references must resolve; no asset injected twice.
          # 4. Same-page #fragment links must resolve to an id in that page.
          for n in range(21, 26):
              page = root / f'chapter{n}' / 'learn.html'
              if not page.exists():
                  continue
              text = page.read_text(encoding='utf-8')
              for ref in sorted(set(re.findall(r'''(?:src|href)="(\.\./assets/[^"]+)"''', text))):
                  target = (page.parent / ref).resolve()
                  if not target.exists():
                      errors.append(f'{page}: broken asset reference {ref}')
              for asset in ['enhance.js', 'upgrade2.js', 'relations.js',
                            'enhance.css', 'upgrade2.css', f'audit{n}.js']:
                  c = text.count(f'../assets/{asset}')
                  if c > 1:
                      errors.append(f'{page}: duplicate injection of ../assets/{asset} x{c}')
              ids = set(re.findall(r'id="([^"]+)"', text))
              for frag in sorted(set(re.findall(r'href="#([^"]+)"', text))):
                  if frag not in ids:
                      errors.append(f'{page}: dead anchor #{frag}')

          if errors:
              print('STATIC CHECK FAILED')
              for e in errors:
                  print(f'::error::{e}')
              sys.exit(1)
          print('Static asset and link checks passed.')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
