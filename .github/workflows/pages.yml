name: Deploy accounting study site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Assemble large learning pages
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' src; do
            dir="$(dirname "$src")"
            base64 -d "$src" | gzip -dc > "$dir/learn.html"
            rm "$src"
          done < <(find . -path './chapter*/learn.html.gz.b64' -print0)
      - name: Inject learning enhancements
        shell: bash
        run: |
          set -euo pipefail
          for n in 21 22 23 24 25; do
            f="chapter${n}/learn.html"
            [ -f "$f" ] || continue
            python3 - "$f" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1])
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="../assets/enhance.css">'
          js='<script src="../assets/enhance.js"></script>'
          rel='<script src="../assets/relations.js"></script>'
          if 'assets/enhance.css' not in s:
              s=s.replace('</head>',css+'</head>')
          if 'assets/enhance.js' not in s:
              s=s.replace('</body>',js+'</body>')
          if 'assets/relations.js' not in s:
              s=s.replace('</body>',rel+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
          done
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="assets/home.js"></script>'
          if 'assets/home.js' not in s:
              s=s.replace('</body>',tag+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Build cross-chapter glossary
        run: python3 tools/build_glossary.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
