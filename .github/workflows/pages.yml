name: Deploy accounting study site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Assemble large learning pages
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' src; do
            dir="$(dirname "$src")"
            base64 -d "$src" | gzip -dc > "$dir/learn.html"
            rm "$src"
          done < <(find . -path './chapter*/learn.html.gz.b64' -print0)
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
